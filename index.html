<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Archipiélago Vivo TV · emisión audiovisual multicanal de iniciativas, territorio, memoria y alternativas de Canarias.">
  <title>Archipiélago Vivo TV</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="header-brand" href="https://archipielagovivo.org/" aria-label="Archipiélago Vivo">
      <img src="logo_archipielagotv.svg" alt="">
      <span>Archipiélago Vivo TV</span>
    </a>

    <nav class="main-nav" aria-label="Archipiélago Vivo">
      <a href="https://archipielagovivo.org/#que-es"><strong>Qué es</strong></a>
      <a href="https://archipielagovivo.org/mapa.html"><strong>Ver mapa</strong></a>
      <a href="https://archipielagovivo.org/agenda.html"><strong>Agenda</strong></a>
      <a href="https://inscripcion.archipielagovivo.org"><strong>Inscripción</strong></a>
      <a href="https://archipielagovivo.org/#contacto"><strong>Contacto</strong></a>
    </nav>

    <div class="channel-switcher" id="channelSwitcher">
      <button class="channel-button" id="channelButton" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="channel-button-copy">
          <span id="channelNumber">CANAL</span>
          <strong id="channelName">Cargando…</strong>
        </span>
        <span class="channel-chevron" aria-hidden="true">▼</span>
      </button>
      <span class="current-program" id="currentProgram">Programación</span>
      <div class="channel-menu" id="channelMenu" role="menu"></div>
    </div>
  </header>

  <main id="stage">
    <div id="player" aria-label="Emisión de Archipiélago Vivo TV"></div>

    <div id="statusScreen">
      <div>
        <img src="logo_archipielagotv.svg" alt="Archipiélago Vivo TV">
        <div class="status-title">ARCHIPIÉLAGO VIVO TV</div>
        <div id="statusText">Cargando parrilla…</div>
      </div>
    </div>

    <div id="standby">
      <div>
        <img src="logo_archipielagotv.svg" alt="">
        <div class="standby-copy">Programación en preparación</div>
        <strong id="standbyProgram">Archipiélago Vivo TV</strong>
      </div>
    </div>

    <aside class="continuity-column" id="continuityColumn" aria-label="Próximos cambios de programa"></aside>

    <aside class="entity-card" id="entityCard">
      <a class="entity-link" id="entityLink" href="#" target="_blank" rel="noopener noreferrer">
        <img id="entityQr" alt="Código QR de la ficha en el mapa">
        <strong id="entityName"></strong>
        <span>Ver ficha en el mapa</span>
      </a>
    </aside>

    <div class="tv-controls">
      <button class="tv-control" id="fullscreenButton" type="button">Pantalla completa</button>
      <button class="tv-control" id="soundButton" type="button">Activar sonido</button>
    </div>

    <div id="debug"></div>
  </main>

  <script src="tv-engine.js"></script>
  <script src="app.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
