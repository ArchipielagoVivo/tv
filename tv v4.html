<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Archipiélago Vivo TV</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #stage,
    #player,
    #player iframe {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
      background: #000;
    }

    /* Pantalla de reserva mientras se obtiene la parrilla o si un vídeo falla. */
    #blackout {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background: #000;
      color: rgba(255,255,255,.72);
      text-align: center;
      padding: 2rem;
      transition: opacity .25s ease;
      pointer-events: none;
    }

    #blackout.hidden {
      opacity: 0;
      visibility: hidden;
    }

    #blackout .brand {
      font-size: clamp(1rem, 2vw, 1.5rem);
      letter-spacing: .05em;
      font-weight: 700;
    }

    #blackout .status {
      margin-top: .65rem;
      font-size: clamp(.72rem, 1vw, .9rem);
      color: rgba(255,255,255,.42);
    }

    /* Controles propios de la emisión. */
    #tvControls {
      position: absolute;
      z-index: 15;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .tv-control {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,.32);
      border-radius: 999px;
      background: rgba(0,0,0,.68);
      color: #fff;
      font: inherit;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 18px rgba(0,0,0,.22);
    }

    .tv-control:hover {
      background: rgba(0,0,0,.82);
      border-color: rgba(255,255,255,.5);
    }

    #soundButton {
      display: none;
    }

    #soundButton.visible {
      display: block;
    }

    @media (max-width: 700px) {
      .tv-control {
        min-height: 38px;
        padding: 0 12px;
        font-size: .82rem;
      }
    }

    /* Diagnóstico: oculto normalmente. Añade ?debug=1 a la URL para verlo. */
    #debug {
      position: absolute;
      z-index: 20;
      left: 10px;
      bottom: 10px;
      max-width: min(720px, calc(100vw - 20px));
      padding: 9px 11px;
      border-radius: 8px;
      background: rgba(0,0,0,.72);
      color: #d8d8d8;
      font: 12px/1.35 ui-monospace, SFMono-Regular, Consolas, monospace;
      white-space: pre-wrap;
      display: none;
      pointer-events: none;
    }

    #debug.visible {
      display: block;
    }
  
    .overlay-brand {
      position: absolute;
      z-index: 12;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      max-width: min(28vw, 340px);
      pointer-events: none;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: .7rem;
      padding: .62rem .9rem;
      border-radius: 999px;
      background: rgba(0,0,0,.58);
      color: #fff;
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 18px rgba(0,0,0,.22);
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.12);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .04em;
      flex: 0 0 auto;
    }

    .brand-text {
      display: grid;
      line-height: 1.05;
    }

    .brand-text strong {
      font-size: clamp(.72rem, 1vw, .88rem);
      letter-spacing: .06em;
    }

    .brand-text span {
      font-size: clamp(.58rem, .82vw, .72rem);
      color: rgba(255,255,255,.72);
      margin-top: .15rem;
    }

    .brand-image {
      display: block;
      max-width: min(26vw, 260px);
      max-height: 84px;
      object-fit: contain;
      filter: drop-shadow(0 3px 10px rgba(0,0,0,.35));
    }

    .overlay-qr {
      position: absolute;
      z-index: 12;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      width: min(23vw, 240px);
      min-width: 160px;
      pointer-events: auto;
    }

    .qr-card {
      display: grid;
      gap: .55rem;
      padding: .78rem;
      border-radius: 16px;
      background: rgba(0,0,0,.64);
      border: 1px solid rgba(255,255,255,.14);
      color: #fff;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 28px rgba(0,0,0,.28);
      text-decoration: none;
    }

    .qr-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      background: #fff;
      padding: .42rem;
      object-fit: contain;
      display: block;
    }

    .qr-copy {
      display: grid;
      gap: .18rem;
    }

    .qr-copy strong {
      font-size: clamp(.78rem, .95vw, .95rem);
      line-height: 1.15;
    }

    .qr-copy span {
      font-size: clamp(.62rem, .8vw, .75rem);
      color: rgba(255,255,255,.78);
      line-height: 1.2;
    }

    @media (max-width: 700px) {
      .overlay-brand { max-width: 56vw; }
      .overlay-qr {
        width: min(34vw, 180px);
        min-width: 128px;
      }
      .brand-badge { padding: .5rem .72rem; }
      .brand-mark { width: 28px; height: 28px; font-size: 9px; }
    }

  </style>
</head>
<body>
  <div id="stage">

    <div class="overlay-brand" id="brandOverlay">
      <div class="brand-badge" id="brandBadge">
        <div class="brand-mark" id="brandMark">AV</div>
        <div class="brand-text">
          <strong>ARCHIPIÉLAGO VIVO</strong>
          <span>TV · emisión continua</span>
        </div>
      </div>
      <img class="brand-image" id="brandImage" alt="Archipiélago Vivo" hidden>
    </div>

    <div class="overlay-qr">
      <a class="qr-card" id="qrCard" href="#" target="_blank" rel="noopener noreferrer" aria-label="Abrir ficha relacionada en el mapa">
        <img class="qr-image" id="qrImage" alt="Código QR">
        <div class="qr-copy">
          <strong id="qrLabel"></strong>
          <span id="qrSublabel"></span>
        </div>
      </a>
    </div>

    <div id="player"></div>

    <div id="blackout">
      <div>
        <div class="brand">ARCHIPIÉLAGO VIVO TV</div>
        <div class="status" id="blackoutStatus">Sincronizando emisión…</div>
      </div>
    </div>

    <div id="tvControls">
      <button id="fullscreenButton" class="tv-control" type="button">⛶ Pantalla completa</button>
      <button id="soundButton" class="tv-control" type="button">🔊 Activar sonido</button>
    </div>

    <div id="debug"></div>
  </div>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------------------
  // CONFIGURACIÓN FIJA DE ARCHIPIÉLAGO VIVO TV
  // ---------------------------------------------------------------------------

  const CHANNEL_NAME = "Archipiélago Vivo TV";
  const PLAYLIST_ID = "PLHnCLhOECJFA";

  // Cada cuatro horas cambia la semilla del shuffle para toda la audiencia.
  const BLOCK_HOURS = 4;
  const BLOCK_MS = BLOCK_HOURS * 60 * 60 * 1000;

  // Corrección de deriva entre el reloj local y el reproductor.
  const CLOCK_SYNC_INTERVAL_MS = 15 * 1000;
  const MAX_ALLOWED_DRIFT_SECONDS = 3;

  // Se vuelve a leer la playlist. Si cambia, todos los clientes que la vean
  // recalculan la misma parrilla determinista para el bloque actual.
  const PLAYLIST_REFRESH_INTERVAL_MS = 5 * 60 * 1000;

  const REQUEST_TIMEOUT_MS = 12000;

  
  const LOGO_IMAGE_URL = ""; 
  // Si se deja vacío, se usa una chapa textual "ARCHIPIÉLAGO VIVO".
  // Si quieres logo real, pon aquí una URL absoluta o relativa a una imagen PNG/SVG.

  const QR_TARGET_URL = "https://REEMPLAZAR-CON-LA-FICHA-DE-PLASTIMAN-CANARIO";
  const QR_LABEL = "Plastiman Canario";
  const QR_SUBLABEL = "Escanea para ver la ficha en el mapa";
  const QR_IMAGE_DATA_URI = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAXIAAAFyAQAAAADAX2ykAAACp0lEQVR4nO2bTYrjMBBGX40FWcrQB8hR5BvMmeZIcwPrKDlAwF4GZL5ZyErSzTQ9QyfuNpQWwUne4gNR/2UT/3Pyj//CwXnnnXfeeeedf4+39QRgDpDNzKwHG+b237ChHucfzCdJ0gTk48VsiAXStBjQSZL0mn+2HucfzM/NQtMpIJ0OIvedNAKrYW+qx/ln8bHUD2lamlf+Sj3OP5TPFiD3f7nar9Hj/Kf45nijgBmMeA5GBAGIeX3aSI/zT+GvCTPpdBDpdJAN80E2sNT0eVs9zj+Ir/Z7s1DlvqMG4XwsrIa9nR7nH8tTi5+kgkY61atNU1d/WzOt6xm/m37n/5HvBPFiGudDtdj6lE6BtdOxrR7nH8I3+52oVitNVEvWWIsk0Ng4t9+98Wv8zUfV1hXEEloy1QnoiqWp30qP80/kq2vuJE2LkU6B6rN/HQs2bK/H+U/z18bjEkQ8m/IQilUjjhcjjZ0sTXj/eZ/8Xfyt84U0dWqZtKQxttFC8vi7Q/4af0swojAASwLBEiAuQfnnOWgbPc4/lm/F7VRzqTX+jlF1dKQxviqC3X53xt/dr6RCu9rb1Le5a/fP++VtAMzsoDrVT9Ni5B5qYQyL95/3ybf+cxsTXUvfQjqFAvFiEM8tz/5u+p3/4LzKn7vWyVKpCXOjOu8/75lfy6BYoCZZ80HkfrF6yem2yfE99Tv/3ql+9+aV1ZqUwHyQMb8UiMXro33ya1xNI8D8gqVTQMw91KzqZtOb6HH+OXzbn9QYCzbEdSZMrqsb7p93yoc33+1mq9lAeQDl/ryVHuefy69bsbPV1XaIqptYX6TH+c/xb/cnga7A3BVLv1+AORQx9+b51S557l8+oVObH9GK4Gl98vp3l7zpY+bu+PvdzjvvvPPOO/8A/g/9spKwJ8DRiwAAAABJRU5ErkJggg==";
const INVIDIOUS_INSTANCES = [
    "https://inv.nadeko.net",
    "https://invidious.nerdvpn.de",
    "https://yt.chocolatemoo53.com",
    "https://invidious.tiekoetter.com",
    "https://invidious.f5.si",
    "https://inv.zoomerville.com"
  ];

  // ---------------------------------------------------------------------------
  // ESTADO
  // ---------------------------------------------------------------------------

  const $ = id => document.getElementById(id);
  const debugEnabled = new URLSearchParams(location.search).get("debug") === "1";

  let player = null;
  let playerReady = false;
  let playlistReady = false;
  let autoplayFallbackUsed = false;

  let activeInvidious =
    localStorage.getItem("avtv_invidious") || INVIDIOUS_INSTANCES[0];

  let videos = [];
  let videoMap = new Map();
  let playlistSignature = "";
  let currentSchedule = null;
  let currentScheduledVideoId = null;
  let failedVideoId = null;

  let blockBoundaryTimer = null;
  let playlistRefreshTimer = null;
  let clockSyncTimer = null;

  // ---------------------------------------------------------------------------
  // UTILIDADES
  // ---------------------------------------------------------------------------

  function log(...parts) {
    if (!debugEnabled) return;
    const now = new Date().toISOString().slice(11, 19);
    $("debug").classList.add("visible");
    $("debug").textContent =
      `[${now}] ${parts.map(x => typeof x === "string" ? x : JSON.stringify(x)).join(" ")}\n` +
      $("debug").textContent.slice(0, 4500);
  }

  function showBlackout(message = "Sincronizando emisión…") {
    $("blackoutStatus").textContent = message;
    $("blackout").classList.remove("hidden");
  }

  function hideBlackout() {
    $("blackout").classList.add("hidden");
  }

  function showSoundButton(show) {
    $("soundButton").classList.toggle("visible", Boolean(show));
  }

  async function fetchJson(url, timeout = REQUEST_TIMEOUT_MS) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), timeout);

    try {
      const response = await fetch(url, {
        signal: ctl.signal,
        headers: { Accept: "application/json" },
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      return await response.json();
    } finally {
      clearTimeout(timer);
    }
  }

  function hash32(input) {
    // FNV-1a de 32 bits. Determinista en todos los navegadores.
    let h = 0x811c9dc5;
    for (let i = 0; i < input.length; i++) {
      h ^= input.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }

  function mulberry32(seed) {
    return function() {
      let t = seed += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function seededShuffle(array, seedText) {
    const a = [...array];
    const rand = mulberry32(hash32(seedText));

    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }

    return a;
  }

  function getBlockInfo(nowMs = Date.now()) {
    const blockNumber = Math.floor(nowMs / BLOCK_MS);
    const startMs = blockNumber * BLOCK_MS;
    const endMs = startMs + BLOCK_MS;

    return {
      number: blockNumber,
      startMs,
      endMs,
      elapsedSeconds: Math.max(0, (nowMs - startMs) / 1000)
    };
  }

  function makePlaylistSignature(list) {
    // Incluye IDs, orden y duración. Todos los clientes que reciban la misma
    // playlist producirán exactamente la misma firma y parrilla.
    return list
      .map((v, index) => `${index}:${v.id}:${v.duration}`)
      .join("|");
  }

  function sanitizeVideos(items) {
    const seen = new Set();
    const result = [];

    for (const item of items || []) {
      const id = item.videoId;
      const duration = Number(item.lengthSeconds) || 0;

      // Sin duración no podemos situarlo correctamente en una emisión sincronizada.
      if (!id || duration <= 0 || seen.has(id)) continue;

      seen.add(id);
      result.push({
        id,
        title: item.title || id,
        duration,
        index: Number(item.index) || result.length
      });
    }

    return result;
  }

  
  function setupBrandOverlay() {
    const brandBadge = $("brandBadge");
    const brandImage = $("brandImage");

    if (LOGO_IMAGE_URL && LOGO_IMAGE_URL.trim()) {
      brandImage.src = LOGO_IMAGE_URL.trim();
      brandImage.hidden = false;
      brandBadge.hidden = true;
    } else {
      brandImage.hidden = true;
      brandBadge.hidden = false;
    }
  }

  function setupQrOverlay() {
    const qrCard = $("qrCard");
    const qrImage = $("qrImage");
    const qrLabel = $("qrLabel");
    const qrSublabel = $("qrSublabel");

    qrCard.href = QR_TARGET_URL;
    qrImage.src = QR_IMAGE_DATA_URI;
    qrLabel.textContent = QR_LABEL;
    qrSublabel.textContent = QR_SUBLABEL;
  }


  // ---------------------------------------------------------------------------
  // PLAYLIST
  // ---------------------------------------------------------------------------

  async function getPlaylistFrom(base) {
    let page = 1;

    const first = await fetchJson(
      `${base}/api/v1/playlists/${encodeURIComponent(PLAYLIST_ID)}?page=1&hl=es`
    );

    let items = [...(first.videos || [])];
    const expected = Number(first.videoCount) || items.length;

    while (items.length < expected && page < 100) {
      page++;
      const next = await fetchJson(
        `${base}/api/v1/playlists/${encodeURIComponent(PLAYLIST_ID)}?page=${page}&hl=es`
      );

      const batch = next.videos || [];
      if (!batch.length) break;
      items.push(...batch);
    }

    const clean = sanitizeVideos(items);

    if (!clean.length) {
      throw new Error(`Playlist vacía o sin duraciones válidas (${first.videoCount ?? "?"}).`);
    }

    return clean;
  }

  async function fetchPlaylistWithFallback() {
    const candidates = [
      activeInvidious,
      ...INVIDIOUS_INSTANCES.filter(x => x !== activeInvidious)
    ];

    const errors = [];

    for (const base of candidates) {
      try {
        const list = await getPlaylistFrom(base);
        activeInvidious = base;
        localStorage.setItem("avtv_invidious", base);
        log("playlist", new URL(base).hostname, list.length, "vídeos");
        return list;
      } catch (err) {
        errors.push(`${new URL(base).hostname}: ${err.message || err}`);
      }
    }

    throw new Error(errors.join(" | "));
  }

  async function refreshPlaylist({ forceResync = false } = {}) {
    try {
      const fresh = await fetchPlaylistWithFallback();
      const signature = makePlaylistSignature(fresh);
      const changed = signature !== playlistSignature;

      videos = fresh;
      videoMap = new Map(fresh.map(v => [v.id, v]));
      playlistReady = true;

      if (changed) {
        playlistSignature = signature;
        log("playlist actualizada", signature.slice(0, 80));
      }

      if (changed || forceResync) {
        buildSchedule();
        syncToBroadcastClock(true);
      }

      return changed;
    } catch (err) {
      log("error playlist", err.message || String(err));

      // Si ya tenemos una parrilla válida, seguimos emitiendo y reintentamos después.
      if (!playlistReady) {
        showBlackout("No se pudo obtener la programación. Reintentando…");
      }

      return false;
    }
  }

  // ---------------------------------------------------------------------------
  // PARRILLA SINCRONIZADA
  // ---------------------------------------------------------------------------

  function buildSchedule(nowMs = Date.now()) {
    if (!playlistReady || !videos.length) return null;

    const block = getBlockInfo(nowMs);

    // La semilla depende sólo del bloque, la playlist y su contenido.
    // Con la misma lista, todos los visitantes obtienen exactamente el mismo orden.
    const seed =
      `${CHANNEL_NAME}|${PLAYLIST_ID}|${block.number}|${playlistSignature}`;

    const order = seededShuffle(
      videos.map(v => v.id),
      seed
    );

    const totalDuration = order.reduce(
      (sum, id) => sum + (videoMap.get(id)?.duration || 0),
      0
    );

    currentSchedule = {
      blockNumber: block.number,
      blockStartMs: block.startMs,
      blockEndMs: block.endMs,
      order,
      totalDuration,
      seed
    };

    log(
      "bloque",
      block.number,
      "duración lista",
      totalDuration,
      "orden",
      order
    );

    scheduleNextBlockBoundary();
    return currentSchedule;
  }

  function scheduledPosition(nowMs = Date.now()) {
    if (!currentSchedule || !currentSchedule.totalDuration) return null;

    const block = getBlockInfo(nowMs);

    // Si hemos cruzado a otro bloque, reconstruimos el shuffle.
    if (block.number !== currentSchedule.blockNumber) {
      buildSchedule(nowMs);
    }

    if (!currentSchedule || !currentSchedule.totalDuration) return null;

    const elapsed =
      Math.max(0, (nowMs - currentSchedule.blockStartMs) / 1000);

    // Si la playlist dura menos de cuatro horas, se repite dentro del bloque.
    const cycleSecond = elapsed % currentSchedule.totalDuration;

    let cursor = 0;

    for (let i = 0; i < currentSchedule.order.length; i++) {
      const id = currentSchedule.order[i];
      const video = videoMap.get(id);
      if (!video) continue;

      const next = cursor + video.duration;

      if (cycleSecond < next) {
        return {
          id,
          title: video.title,
          index: i,
          offsetSeconds: Math.max(0, cycleSecond - cursor),
          remainingSeconds: Math.max(0, next - cycleSecond),
          blockNumber: currentSchedule.blockNumber
        };
      }

      cursor = next;
    }

    // Protección contra errores de coma flotante.
    const firstId = currentSchedule.order[0];
    const first = videoMap.get(firstId);

    return first ? {
      id: firstId,
      title: first.title,
      index: 0,
      offsetSeconds: 0,
      remainingSeconds: first.duration,
      blockNumber: currentSchedule.blockNumber
    } : null;
  }

  function scheduleNextBlockBoundary() {
    clearTimeout(blockBoundaryTimer);

    const { endMs } = getBlockInfo();
    const delay = Math.max(250, endMs - Date.now() + 150);

    blockBoundaryTimer = setTimeout(async () => {
      log("nuevo bloque");
      await refreshPlaylist({ forceResync: true });
    }, delay);
  }

  function syncToBroadcastClock(force = false) {
    if (!playerReady || !playlistReady || !player) return;

    const target = scheduledPosition();
    if (!target) return;

    let playerVideoId = "";
    let playerTime = 0;
    let state = -1;

    try {
      playerVideoId = player.getVideoData()?.video_id || "";
      playerTime = Number(player.getCurrentTime()) || 0;
      state = player.getPlayerState();
    } catch (_) {}

    const drift = Math.abs(playerTime - target.offsetSeconds);
    const wrongVideo = playerVideoId !== target.id;

    log(
      "sync",
      target.id,
      `@${target.offsetSeconds.toFixed(1)}s`,
      "actual",
      playerVideoId || "-",
      `@${playerTime.toFixed(1)}s`,
      "drift",
      drift.toFixed(1)
    );

    // Si este vídeo dio error, mantenemos la pantalla negra durante su franja.
    // Así no adelantamos a unos espectadores respecto a otros.
    if (failedVideoId === target.id) {
      currentScheduledVideoId = target.id;
      showBlackout(`Contenido temporalmente no disponible · siguiente en ${Math.ceil(target.remainingSeconds)} s`);
      return;
    }

    if (failedVideoId && failedVideoId !== target.id) {
      failedVideoId = null;
    }

    if (force || wrongVideo) {
      currentScheduledVideoId = target.id;
      showBlackout("Sincronizando emisión…");

      player.loadVideoById({
        videoId: target.id,
        startSeconds: target.offsetSeconds
      });

      return;
    }

    // El reproductor puede desviarse por buffering, pestañas suspendidas o anuncios.
    // Corregimos la deriva sólo cuando el vídeo normal está accesible.
    if (
      drift > MAX_ALLOWED_DRIFT_SECONDS &&
      state !== YT.PlayerState.BUFFERING
    ) {
      try {
        player.seekTo(target.offsetSeconds, true);
        log("seek corrección", target.offsetSeconds.toFixed(1));
      } catch (_) {}
    }

    if (state === YT.PlayerState.PAUSED || state === YT.PlayerState.CUED) {
      try { player.playVideo(); } catch (_) {}
    }
  }

  // ---------------------------------------------------------------------------
  // YOUTUBE IFRAME API
  // ---------------------------------------------------------------------------

  window.onYouTubeIframeAPIReady = function() {
    const vars = {
      autoplay: 1,
      controls: 0,
      disablekb: 1,
      fs: 0,
      playsinline: 1,
      rel: 0,
      iv_load_policy: 3
    };

    if (location.protocol === "http:" || location.protocol === "https:") {
      vars.origin = location.origin;
    }

    player = new YT.Player("player", {
      width: "100%",
      height: "100%",
      playerVars: vars,
      events: {
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange,
        onError: onPlayerError,
        onAutoplayBlocked: onAutoplayBlocked
      }
    });
  };

  function onPlayerReady() {
    playerReady = true;
    log("YouTube ready");

    // Intentamos primero con sonido. Si el navegador lo bloquea,
    // onAutoplayBlocked() pasa automáticamente a mute.
    syncToBroadcastClock(true);
  }

  function onPlayerStateChange(event) {
    const state = event.data;

    if (state === YT.PlayerState.PLAYING) {
      hideBlackout();

      try {
        if (!player.isMuted()) showSoundButton(false);
      } catch (_) {}
    }

    if (state === YT.PlayerState.ENDED) {
      // No "avanzamos uno": consultamos el reloj de emisión.
      // De este modo todos siguen la misma línea temporal.
      setTimeout(() => syncToBroadcastClock(true), 100);
    }
  }

  function onPlayerError(event) {
    const code = Number(event.data);
    failedVideoId = currentScheduledVideoId || scheduledPosition()?.id || null;

    const labels = {
      2: "parámetro de vídeo inválido",
      5: "error del reproductor HTML5",
      100: "vídeo eliminado o privado",
      101: "vídeo no autorizado para reproducción embebida",
      150: "vídeo no autorizado para reproducción embebida",
      153: "origen/referer no identificado"
    };

    log("YouTube error", code, labels[code] || "");

    const target = scheduledPosition();

    if (target && target.id === failedVideoId) {
      showBlackout(
        `Contenido temporalmente no disponible · siguiente en ${Math.ceil(target.remainingSeconds)} s`
      );
    } else {
      showBlackout("Contenido temporalmente no disponible");
    }
  }

  function onAutoplayBlocked() {
    log("autoplay bloqueado");

    if (!autoplayFallbackUsed) {
      autoplayFallbackUsed = true;

      try {
        player.mute();
        player.playVideo();
        showSoundButton(true);
        log("fallback autoplay muted");
        return;
      } catch (_) {}
    }

    showSoundButton(true);
  }


  // ---------------------------------------------------------------------------
  // PANTALLA COMPLETA
  // ---------------------------------------------------------------------------

  function isFullscreen() {
    return Boolean(
      document.fullscreenElement ||
      document.webkitFullscreenElement
    );
  }

  function updateFullscreenButton() {
    const button = $("fullscreenButton");
    const fullscreen = isFullscreen();

    button.textContent = fullscreen
      ? "⤢ Salir de pantalla completa"
      : "⛶ Pantalla completa";

    button.setAttribute(
      "aria-label",
      fullscreen ? "Salir de pantalla completa" : "Ir a pantalla completa"
    );
  }

  async function enterFullscreen() {
    const target = $("stage");

    if (target.requestFullscreen) {
      await target.requestFullscreen();
      return;
    }

    if (target.webkitRequestFullscreen) {
      target.webkitRequestFullscreen();
      return;
    }

    throw new Error("Este navegador no ofrece la API de pantalla completa.");
  }

  async function exitFullscreen() {
    if (document.exitFullscreen) {
      await document.exitFullscreen();
      return;
    }

    if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
      return;
    }
  }

  async function toggleFullscreen() {
    try {
      if (isFullscreen()) {
        await exitFullscreen();
      } else {
        await enterFullscreen();
      }
    } catch (err) {
      log("fullscreen", err.message || String(err));
    } finally {
      updateFullscreenButton();
    }
  }

  $("fullscreenButton").addEventListener("click", toggleFullscreen);

  document.addEventListener("fullscreenchange", updateFullscreenButton);
  document.addEventListener("webkitfullscreenchange", updateFullscreenButton);


  // ---------------------------------------------------------------------------
  // SONIDO
  // ---------------------------------------------------------------------------

  $("soundButton").addEventListener("click", () => {
    if (!playerReady || !player) return;

    try {
      player.unMute();
      player.setVolume(100);
      player.playVideo();
      showSoundButton(false);
    } catch (_) {}
  });

  // ---------------------------------------------------------------------------
  // TEMPORIZADORES
  // ---------------------------------------------------------------------------

  function startTimers() {
    clearInterval(clockSyncTimer);
    clearInterval(playlistRefreshTimer);

    clockSyncTimer = setInterval(() => {
      syncToBroadcastClock(false);
    }, CLOCK_SYNC_INTERVAL_MS);

    playlistRefreshTimer = setInterval(async () => {
      const changed = await refreshPlaylist();

      // Si la lista no cambió, seguimos corrigiendo únicamente el reloj.
      if (!changed) syncToBroadcastClock(false);
    }, PLAYLIST_REFRESH_INTERVAL_MS);
  }

  // ---------------------------------------------------------------------------
  // ARRANQUE
  // ---------------------------------------------------------------------------

  document.title = CHANNEL_NAME;
  setupBrandOverlay();
  setupQrOverlay();
  updateFullscreenButton();

  if (debugEnabled) {
    $("debug").classList.add("visible");
  }

  // API oficial de YouTube.
  const yt = document.createElement("script");
  yt.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(yt);

  startTimers();
  refreshPlaylist({ forceResync: true });

})();
</script>
</body>
</html>
